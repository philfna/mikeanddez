document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

mily: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ad3a7197-7f23-43a4-ab3c-61f79498c752\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7d966f7f-b6b0-46b1-9b9c-8949e088cc09\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"86033ea7-ddbf-43f5-a3be-ddff3a99e87e\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fafca050-1572-4c8c-b779-f6ec227c7980\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ad3a7197-7f23-43a4-ab3c-61f79498c752\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Marcellus';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8b07ef51-10fd-40cf-9c77-896d821f4899\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Marcellus';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4a1800cc-2df3-485b-8c3f-5097c767803e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"9a918f73-6d17-4f0a-b936-6eabac89a447\"><\u002Fscript>\n<style>\n  *{ box-sizing:border-box; }\n  html,body{ margin:0; }\n  body{ background:#EBE4D6; }\n  a{ color:inherit; }\n  ::-webkit-scrollbar{ height:0; width:0; }\n  textarea, input{ font-family:'Hanken Grotesk',sans-serif; }\n  textarea::placeholder, input::placeholder{ color:#b3ad9e; }\n  .hk-tab:hover{ color:#1F1E1B !important; }\n  .hk-pin:hover{ background:#fff !important; border-color:#C2522E !important; }\n  .hk-card:hover{ box-shadow:0 6px 26px rgba(60,48,34,0.10) !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:860px; margin:0 auto; min-height:100vh; background:#F4EFE6; color:#1F1E1B; font-family:'Hanken Grotesk',sans-serif; box-shadow:0 0 60px rgba(60,48,34,0.07);\">\n\n  <!-- ================= HERO ================= -->\n  <div style=\"padding:38px 38px 36px; border-bottom:1px solid #1F1E1B;\">\n    <div style=\"display:flex; justify-content:space-between; align-items:baseline; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:#9a9482;\">\n      <span>San Francisco<\u002Fspan><span>{{ heroDates }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height:1px; background:#1F1E1B; margin:15px 0 28px;\"><\u002Fdiv>\n    <div style=\"font-size:11px; letter-spacing:0.26em; text-transform:uppercase; font-weight:600; color:{{ accent }};\">{{ kicker }}<\u002Fdiv>\n    <div style=\"font-family:'Marcellus',serif; font-size:clamp(46px,11vw,76px); line-height:0.96; letter-spacing:-0.01em; margin:10px 0 20px;\">{{ guest }}<\u002Fdiv>\n    <div style=\"font-size:15.5px; line-height:1.6; color:#54503f; max-width:440px;\">{{ subtitle }}<\u002Fdiv>\n    <div style=\"display:flex; margin-top:30px; border:1px solid #1F1E1B; max-width:520px;\">\n      <div style=\"flex:1; padding:13px 16px; border-right:1px solid #1F1E1B;\">\n        <div style=\"font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:#9a9482;\">Arrive<\u002Fdiv>\n        <div style=\"font-family:'Marcellus',serif; font-size:17px; margin-top:4px;\">{{ arriveLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1; padding:13px 16px; border-right:1px solid #1F1E1B;\">\n        <div style=\"font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:#9a9482;\">Stay<\u002Fdiv>\n        <div style=\"font-family:'Marcellus',serif; font-size:17px; margin-top:4px;\">{{ stayLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1; padding:13px 16px;\">\n        <div style=\"font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:#9a9482;\">Depart<\u002Fdiv>\n        <div style=\"font-family:'Marcellus',serif; font-size:17px; margin-top:4px;\">{{ departLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ================= NAV ================= -->\n  <div style=\"position:sticky; top:0; z-index:50; display:flex; gap:26px; padding:0 38px; background:#F4EFE6; border-bottom:1px solid #E2DACB; overflow-x:auto;\">\n    <sc-for list=\"{{ nav }}\" as=\"t\" hint-placeholder-count=\"9\">\n      <button class=\"hk-tab\" onclick=\"{{ t.on }}\" style=\"flex:none; appearance:none; background:none; border:none; border-bottom:2px solid {{ t.border }}; padding:15px 0; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:12px; letter-spacing:0.05em; font-weight:{{ t.weight }}; color:{{ t.color }}; white-space:nowrap;\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ================= SCHEDULE ================= -->\n  <div style=\"display:{{ show.schedule }}; padding:30px 38px 56px;\">\n    <div style=\"font-family:'Marcellus',serif; font-size:27px; margin-bottom:5px;\">Trip Schedule<\u002Fdiv>\n    <div style=\"font-size:13.5px; color:#8a857a; margin-bottom:24px; max-width:520px;\">A loose frame for the days — dinner is around 5 PM, everything else is yours. Add activities below and they slot in here.<\u002Fdiv>\n    <sc-for list=\"{{ schedule }}\" as=\"day\" hint-placeholder-count=\"4\">\n      <div style=\"margin-bottom:22px; border:1px solid #E2DACB; background:#fff;\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid #efe9dc; flex-wrap:wrap;\">\n          <div>\n            <div style=\"font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }}; font-weight:600;\">{{ day.label }}<\u002Fdiv>\n            <div style=\"font-family:'Marcellus',serif; font-size:20px; margin-top:3px;\">{{ day.date }}<\u002Fdiv>\n            <div style=\"font-size:12px; color:#9a9482; margin-top:2px;\">{{ day.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px; letter-spacing:0.04em; color:#8a857a; border:1px solid #E2DACB; padding:5px 10px;\">{{ day.wx }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:6px 20px 4px;\">\n          <sc-for list=\"{{ day.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid; grid-template-columns:84px 14px 1fr; gap:12px; align-items:start; padding:10px 0; border-bottom:1px solid #f4efe2;\">\n              <div style=\"font-size:11.5px; color:#9a9482; padding-top:2px; letter-spacing:0.02em;\">{{ r.time }}<\u002Fdiv>\n              <div style=\"width:8px; height:8px; border-radius:50%; margin-top:6px; background:{{ r.dot }};\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:14px; font-weight:500;\">{{ r.label }}<\u002Fdiv>\n                <sc-if value=\"{{ r.note }}\" hint-placeholder-val=\"x\"><div style=\"font-size:12px; color:#8a857a; margin-top:2px; line-height:1.5;\">{{ r.note }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:12px 20px 16px; border-top:1px dashed #E2DACB;\">\n          <div style=\"font-size:9.5px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#b3ad9e; margin-bottom:6px;\">Notes for this day<\u002Fdiv>\n          <textarea defaultvalue=\"{{ day.noteVal }}\" oninput=\"{{ day.onNote }}\" placeholder=\"Reservation confirmations, arrival times, reminders…\" style=\"width:100%; min-height:46px; resize:vertical; border:1px solid #E2DACB; background:#fbf8f1; border-radius:0; padding:9px 11px; font-size:12.5px; color:#1F1E1B; line-height:1.5;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ================= PACK ================= -->\n  <div style=\"display:{{ show.pack }}; padding:30px 38px 56px;\">\n    <div style=\"font-family:'Marcellus',serif; font-size:27px; margin-bottom:5px;\">What to Pack<\u002Fdiv>\n    <div style=\"font-size:13.5px; color:#8a857a; margin-bottom:24px; max-width:520px;\">July in SF is famously cold — locals call it “No Sky July.” Average high is 67°F but evenings drop to the mid-50s. Here's what actually gets used.<\u002Fdiv>\n\n    <div class=\"hk-card\" style=\"border:1px solid #E2DACB; background:#fff; padding:22px; margin-bottom:16px; transition:box-shadow .2s;\">\n      <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; font-weight:600; margin-bottom:10px;\">Clothes — the #1 thing visitors get wrong<\u002Fdiv>\n      <div style=\"font-size:13.5px; line-height:1.7; color:#54503f;\">Foggy mornings, breezy bayside afternoons, mid-50s nights. Karl the Fog rolls in most mornings and evenings, burning off by midday — but the wind makes it feel colder than the number suggests. <strong style=\"color:#1F1E1B;\">Tourists in shorts suffer. You won't.<\u002Fstrong><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;\">\n        <div style=\"border:1px solid #E2DACB; padding:14px;\">\n          <div style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:{{ accent }}; margin-bottom:9px;\">Must bring<\u002Fdiv>\n          <sc-for list=\"{{ packMust }}\" as=\"x\" hint-placeholder-count=\"6\"><div style=\"font-size:12.5px; color:#54503f; line-height:1.45; padding:3px 0; border-bottom:1px solid #f4efe2;\">{{ x }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #cdd2bf; background:#f3f5ec; padding:14px;\">\n          <div style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#5d6a4d; margin-bottom:9px;\">For Muir Woods<\u002Fdiv>\n          <sc-for list=\"{{ packMuir }}\" as=\"x\" hint-placeholder-count=\"5\"><div style=\"font-size:12.5px; color:#54503f; line-height:1.45; padding:3px 0; border-bottom:1px solid #e6ead9;\">{{ x }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hk-card\" style=\"border:1px solid #E2DACB; background:#fff; padding:22px; margin-bottom:16px; transition:box-shadow .2s;\">\n      <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; font-weight:600; margin-bottom:14px;\">Apps to download before you come<\u002Fdiv>\n      <sc-for list=\"{{ apps }}\" as=\"a\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #f4efe2;\">\n          <div style=\"font-family:'Marcel ll .15s;\">\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:8px;\">\n              <div style=\"font-family:'Marcellus',serif; font-size:16px;\">{{ c.title }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:{{ accent }}; font-weight:600;\">{{ c.mark }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; color:#8a857a; line-height:1.55; margin-top:6px;\">{{ c.desc }}<\u002Fdiv>\n            <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;\">\n              <sc-for list=\"{{ c.tags }}\" as=\"t\" hint-placeholder-count=\"2\"><span style=\"font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:#7d7869; border:1px solid #E2DACB; padding:2px 7px;\">{{ t }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"text-align:center; margin-top:26px;\">\n      <button onclick=\"{{ goSchedule }}\" style=\"appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; color:#F4EFE6; background:{{ accent }}; border:none; padding:13px 26px;\">See my schedule →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ================= LOCAL PICKS ================= -->\n  <div style=\"display:{{ show.localpicks }}; padding:30px 38px 56px;\">\n    <div style=\"font-family:'Marcellus',serif; font-size:27px; margin-bottom:5px;\">Local Picks<\u002Fdiv>\n    <div style=\"font-size:13.5px; color:#8a857a; margin-bottom:22px; max-width:540px;\">Our full running list of SF spots — a browsable reference. Tap a category to filter; tap a name to open its site.<\u002Fdiv>\n\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#1F1E1B; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #1F1E1B;\">Eat &amp; Drink<\u002Fdiv>\n    <div style=\"display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px;\">\n      <sc-for list=\"{{ restChips }}\" as=\"ch\" hint-placeholder-count=\"6\"><button onclick=\"{{ ch.on }}\" style=\"appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:11px; letter-spacing:0.04em; text-transform:capitalize; color:{{ ch.color }}; background:{{ ch.bg }}; border:1px solid {{ ch.border }}; padding:5px 12px;\">{{ ch.label }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:11px; color:#9a9482; margin-bottom:12px;\">{{ restCount }}<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:30px;\">\n      <sc-for list=\"{{ restList }}\" as=\"x\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #E2DACB; background:#fff; padding:14px 16px;\">\n          <a href=\"{{ x.href }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; font-family:'Marcellus',serif; font-size:16px; color:#1F1E1B;\">{{ x.name }}{{ x.suffix }}<\u002Fa>\n          <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;\">\n            <sc-for list=\"{{ x.tags }}\" as=\"t\" hint-placeholder-count=\"2\"><span style=\"font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; color:{{ t.color }}; border:1px solid {{ t.border }}; padding:2px 7px;\">{{ t.text }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ x.comments }}\" hint-placeholder-val=\"x\"><div style=\"font-size:12px; color:#8a857a; line-height:1.5;\">{{ x.comments }}<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ x.tip }}\" hint-placeholder-val=\"x\"><div style=\"font-size:11.5px; color:#54503f; line-height:1.55; margin-top:8px; padding-top:9px; border-top:1px solid #efe9dc;\"><span style=\"color:{{ accent }}; font-weight:600; letter-spacing:0.04em;\">Good to know — <\u002Fspan>{{ x.tip }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#1F1E1B; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #1F1E1B;\">Explore<\u002Fdiv>\n    <div style=\"display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px;\">\n      <sc-for list=\"{{ explChips }}\" as=\"ch\" hint-placeholder-count=\"6\"><button onclick=\"{{ ch.on }}\" style=\"appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:11px; letter-spacing:0.04em; text-transform:capitalize; color:{{ ch.color }}; background:{{ ch.bg }}; border:1px solid {{ ch.border }}; padding:5px 12px;\">{{ ch.label }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:11px; color:#9a9482; margin-bottom:12px;\">{{ explCount }}<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px;\">\n      <sc-for list=\"{{ explList }}\" as=\"x\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #E2DACB; background:#fff; padding:14px 16px;\">\n          <a href=\"{{ x.href }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; font-family:'Marcellus',serif; font-size:16px; color:#1F1E1B;\">{{ x.name }}{{ x.suffix }}<\u002Fa>\n          <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;\">\n            <sc-for list=\"{{ x.tags }}\" as=\"t\" hint-placeholder-count=\"1\"><span style=\"font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; color:{{ t.color }}; border:1px solid {{ t.border }}; padding:2px 7px;\">{{ t.text }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ x.comments }}\" hint-placeholder-val=\"x\"><div style=\"font-size:12px; color:#8a857a; line-height:1.5;\">{{ x.comments }}<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ x.tip }}\" hint-placeholder-val=\"x\"><div style=\"font-size:11.5px; color:#54503f; line-height:1.55; margin-top:8px; padding-top:9px; border-top:1px solid #efe9dc;\"><span style=\"color:{{ accent }}; font-weight:600; letter-spacing:0.04em;\">Good to know — <\u002Fspan>{{ x.tip }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ================= SHARE ================= -->\n  <div style=\"display:{{ show.save }}; padding:30px 38px 64px;\">\n    <div style=\"font-family:'Marcellus',serif; font-size:27px; margin-bottom:5px;\">Save &amp; Share<\u002Fdiv>\n    <div style=\"font-size:13.5px; color:#8a857a; margin-bottom:22px; max-width:520px;\">Your selections auto-save in your browser. Share a link so everyone sees the same plan.<\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:9px; border:1px solid #cdd2bf; background:#f3f5ec; padding:11px 15px; font-size:12.5px; color:#5d6a4d; margin-bottom:18px;\">\n      <span style=\"width:7px; height:7px; border-radius:50%; background:#717B5F; display:inline-block;\"><\u002Fspan>{{ saveStatus }}\n    <\u002Fdiv>\n\n    <div style=\"background:#1F1E1B; color:#F4EFE6; padding:22px; margin-bottom:16px;\">\n      <div style=\"font-family:'Marcellus',serif; font-size:19px; margin-bottom:6px; color:#fff;\">Share a live link<\u002Fdiv>\n      <div style=\"font-size:13px; color:#c9c3b4; margin-bottom:15px; line-height:1.6;\">Generate a shareable URL with your current selections baked in — send it on and they open the same plan you built.<\u002Fdiv>\n      <div style=\"display:flex; gap:9px; flex-wrap:wrap;\">\n        <button onclick=\"{{ copyLink }}\" style=\"appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:#1F1E1B; background:{{ accent }}; border:none; padding:11px 20px; color:#fff;\">{{ copyLabel }}<\u002Fbutton>\n        <button onclick=\"{{ emailLink }}\" style=\"appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:#F4EFE6; background:none; border:1px solid rgba(244,239,230,0.35); padding:11px 20px;\">Email it<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E2DACB; background:#fff; padding:22px; margin-bottom:16px;\">\n      <div style=\"font-family:'Marcellus',serif; font-size:18px; margin-bottom:5px;\">Printable summary<\u002Fdiv>\n      <div style=\"font-size:12.5px; color:#8a857a; margin-bottom:14px; line-height:1.6;\">A full text version — flights, weather, schedule, selected activities, and snack checklist.<\u002Fdiv>\n      <button onclick=\"{{ genSummary }}\" style=\"appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:#1F1E1B; background:none; border:1px solid #1F1E1B; padding:11px 20px;\">Generate summary<\u002Fbutton>\n      <sc-if value=\"{{ summaryText }}\" hint-placeholder-val=\"\">\n        <div style=\"margin-top:16px;\">\n          <pre style=\"white-space:pre-wrap; font-family:'SF Mono',ui-monospace,Menlo,monospace; font-size:11px; line-height:1.55; color:#54503f; background:#faf6ec; border:1px solid #efe9dc; padding:16px; max-height:340px; overflow:auto;\">{{ summaryText }}<\u002Fpre>\n          <button onclick=\"{{ copySummary }}\" style=\"margin-top:10px; appearance:none; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:#F4EFE6; background:{{ accent }}; border:none; padding:10px 18px;\">{{ copySumLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E2DACB; background:#fff; padding:22px;\">\n      <div style=\"font-family:'Marcellus',serif; font-size:18px; margin-bottom:4px;\">Host notes<\u002Fdiv>\n      <div style=\"font-size:12.5px; color:#8a857a; margin-bottom:12px;\">Reminders, pickup logistics, reservation confirmations — anything extra. Auto-saved.<\u002Fdiv>\n      <textarea defaultvalue=\"{{ hostNoteVal }}\" oninput=\"{{ onHostNote }}\" placeholder=\"e.g. Alcatraz booked Tue · Muir Woods reservation confirmed · Korean BBQ 5 PM Thu…\" style=\"width:100%; min-height:80px; resize:vertical; border:1px solid #E2DACB; background:#fbf8f1; padding:11px; font-size:12.5px; color:#1F1E1B; line-height:1.5;\"><\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div style=\"text-align:center; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#b3ad9e; margin-top:34px;\">Welcome to San Francisco<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:760},&quot;guestName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nora&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Guest&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Welcome&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Guest&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Three days in the city by the bay — everything you need is here. Wander, taste, and make it your own.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Guest&quot;},&quot;heroDates&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jul 13 – 16&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dates&quot;},&quot;arriveLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mon Jul 13&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dates&quot;},&quot;stayLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nob Hill&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dates&quot;},&quot;departLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Thu Jul 16&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dates&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1221 Jones Street&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;neighborhood&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nob Hill&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C2522E&quot;,&quot;options&quot;:[&quot;#C2522E&quot;,&quot;#B0813C&quot;,&quot;#6E7C5B&quot;,&quot;#9A4F48&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const ls = (k, d) => { try { const v = localStorage.getItem(this.key(k)); return v == null ? d : JSON.parse(v); } catch { return d; } };\n    this.state = {\n      tab: 'schedule',\n      acts: ls('acts', []),\n      snacks: ls('snacks', this.defaultSnacks()),\n      restFilter: '__all__',\n      explFilter: '__all__',\n      summaryText: '',\n      copyLabel: 'Copy share link',\n      copySumLabel: 'Copy to clipboard',\n      saveStatus: 'All changes auto-save to your browser.',\n      ready: !!window.SFDATA\n    };\n    this._notes = {\n      snack: this.lsRaw('snacknote', ''),\n      host: this.lsRaw('hostnote', ''),\n      days: ls('daynotes', {})\n    };\n  }\n  key(k){ const g = (this.props.guestName || 'guest').toLowerCase().replace(/[^a-z0-9]+/g,'-'); return 'sfw_' + g + '_' + k; }\n  lsRaw(k, d){ try { const v = localStorage.getItem(this.key(k)); return v == null ? d : v; } catch { return d; } }\n  defaultSnacks(){ return ['drinks-0','brands-0','sweet-6']; }\n\n  componentDidMount(){\n    if (!window.SFDATA) {\n      this._onData = () => this.setState({ ready: true });\n      window.addEventListener('sfdata-ready', this._onData);\n    }\n  }\n  componentWillUnmount(){ if (this._onData) window.removeEventListener('sfdata-ready', this._onData); }\n\n  save(){\n    try {\n      localStorage.setItem(this.key('acts'), JSON.stringify(this.state.acts));\n      localStorage.setItem(this.key('snacks'), JSON.stringify(this.state.snacks));\n      localStorage.setItem(this.key('daynotes'), JSON.stringify(this._notes.days));\n      localStorage.setItem(this.key('snacknote'), this._notes.snack);\n      localStorage.setItem(this.key('hostnote'), this._notes.host);\n    } catch {}\n    this.flash();\n  }\n  flash(){\n    this.setState({ saveStatus: 'Saved.' });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ saveStatus: 'All changes auto-save to your browser.' }), 1800);\n  }\n\n  setTab(t){ this.setState({ tab: t }); try { window.scrollTo(0, 0); } catch {} }\n  toggleAct(id){\n    const acts = this.state.acts.includes(id) ? this.state.acts.filter(x => x !== id) : [...this.state.acts, id];\n    this.setState({ acts }, () => this.save());\n  }\n  toggleSnack(k){\n    const snacks = this.state.snacks.includes(k) ? this.state.snacks.filter(x => x !== k) : [...this.state.snacks, k];\n    this.setState({ snacks }, () => this.save());\n  }\n\n  // ---- derived schedule ----\n  buildSchedule(D){\n    const AI = D.ACT_INFO || {};\n    const dot = { flight:'#4A5B66', transit:'#C2522E', rest:'#c4bdac', food:'#b0813c', night:'#5b6b74', activity:'#717B5F' };\n    return (D.SCHEDULE || []).map(day => {\n      const picks = (day.cand || []).filter(id => this.state.acts.includes(id) && AI[id]).map(id => ({\n        time: AI[id].time, label: AI[id].name, note: AI[id].note, dot: dot.activity\n      }));\n      const base = (day.rows || []).map(r => ({ ...r, dot: dot[r.dot] || '#c4bdac' }));\n      const tail = (day.tail || []).map(r => ({ ...r, dot: dot[r.dot] || '#c4bdac' }));\n      return {\n        label: day.label, date: day.date, sub: day.sub, wx: day.wx,\n        rows: [...base, ...picks, ...tail],\n        noteVal: this._notes.days[day.key] || '',\n        onNote: (e) => { this._notes.days[day.key] = e.target.value; this.save(); }\n      };\n    });\n  }\n\n  buildSummary(D){\n    const AI = D.ACT_INFO || {}, SN = D.SNACKS || {};\n    const L = [];\n    const rule = '─────────────────────────────────────';\n    L.push('WELCOME TO SAN FRANCISCO — ' + (this.props.guestName || 'Guest').toUpperCase());\n    L.push((this.props.address || '') + (this.props.neighborhood ? ' · ' + this.props.neighborhood : ''));\n    L.push('');\n    L.push('FLIGHTS'); L.push(rule);\n    (D.FLIGHTS || []).forEach(f => L.push('  ' + f.tag.toUpperCase() + '  ' + f.fromT + ' ' + f.fromC + ' → ' + f.toT + ' ' + f.toC + '  (' + f.date + ')'));\n    L.push('');\n    L.push('WEATHER (July averages)'); L.push(rule);\n    (D.WEATHER || []).forEach(w => L.push('  ' + w.day + ':  Hi ' + w.hi + ' / Lo ' + w.lo + ' — ' + w.desc));\n    L.push('  Pack layers every day.');\n    L.push('');\n    if (this.state.acts.length){\n      L.push('SELECTED ACTIVITIES'); L.push(rule);\n      this.state.acts.forEach(id => { if (AI[id]) L.push('  • ' + AI[id].name + ' — ' + AI[id].time); });\n      L.push('');\n    }\n    L.push('SCHEDULE  (dinner ~5 PM each day)'); L.push(rule);\n    this.buildSchedule(D).forEach(day => {\n      L.push(day.date + '  ·  ' + day.wx);\n      day.rows.forEach(r => L.push('  ' + (r.time + '        ').slice(0, 11) + r.label));\n      if (day.noteVal) L.push('  note: ' + day.noteVal);\n      L.push('');\n    });\n    const checked = [];\n    Object.keys(SN).forEach(cat => (SN[cat].items || []).forEach((it, i) => { if (this.state.snacks.includes(cat + '-' + i)) checked.push(it); }));\n    if (checked.length){ L.push('SNACK CHECKLIST'); L.push(rule); checked.forEach(s => L.push('  [ ] ' + s)); if (this._notes.snack) { L.push(''); L.push('  Notes: ' + this._notes.snack); } L.push(''); }\n    if (this._notes.host){ L.push('HOST NOTES'); L.push(rule); L.push(this._notes.host); L.push(''); }\n    L.push(rule);\n    L.push(\"Made for \" + (this.props.guestName || 'you') + \"'s SF stay.\");\n    return L.join('\\n');\n  }\n\n  shareUrl(){\n    const st = { a: this.state.acts, s: this.state.snacks, sn: this._notes.snack, hn: this._notes.host, dn: this._notes.days };\n    let enc = '';\n    try { enc = btoa(unescape(encodeURIComponent(JSON.stringify(st)))); } catch {}\n    return location.origin + location.pathname + '#state=' + enc;\n  }\n\n  renderVals(){\n    const p = this.props;\n    const accent = p.accent || '#C2522E';\n    const D = window.SFDATA || {};\n    const tab = this.state.tab;\n    const show = {};\n    ['schedule','pack','flights','hood','food','snacks','activities','localpicks','save'].forEach(id => show[id] = tab === id ? 'block' : 'none');\n\n    const navDefs = [\n      ['schedule','Schedule'],['pack','Pack'],['flights','Flights'],['hood','Neighborhood'],\n      ['food','Food'],['snacks','Snacks'],['activities','Activities'],['localpicks','Local Picks'],['save','Share']\n    ];\n    const nav = navDefs.map(([id, label]) => ({\n      label, on: () => this.setTab(id),\n      color: tab === id ? '#1F1E1B' : '#9a9482',\n      border: tab === id ? accent : 'transparent',\n      weight: tab === id ? 600 : 400\n    }));\n\n    // weather\n    const weather = (D.WEATHER || []).map(w => ({ ...w, border: w.hot ? '#e6c4b6' : '#E2DACB', bg: w.hot ? '#f8efe9' : '#fff' }));\n    // flights\n    const flights = (D.FLIGHTS || []).map(f => ({ ...f,\n      tagColor: f.tag === 'Outbound' ? '#5d6a4d' : '#4A5B66',\n      tagBorder: f.tag === 'Outbound' ? '#cdd2bf' : '#bcc7cf' }));\n\n    // food (static)\n    const foodGroups = (D.FOOD_GROUPS || []).map(g => ({ title: g.title, cards: g.cards.map(c => ({ ...c, edge: c.fave ? ('3px solid ' + accent) : '1px solid #E2DACB' })) }));\n\n    // snacks\n    const SN = D.SNACKS || {};\n    const snackGroups = Object.keys(SN).map(cat => ({\n      label: SN[cat].label,\n      items: (SN[cat].items || []).map((label, i) => {\n        const k = cat + '-' + i, on = this.state.snacks.includes(k);\n        return { label, on: () => this.toggleSnack(k),\n          border: on ? accent : '#E2DACB', bg: on ? '#f8efe9' : '#fff',\n          boxBorder: on ? accent : '#cdbfa8', boxBg: on ? accent : 'transparent', mark: on ? '✓' : '' };\n      })\n    }));\n\n    // activities\n    const actGroups = (D.ACT_GROUPS || []).map(g => ({\n      title: g.title,\n      cards: g.cards.map(c => {\n        const on = this.state.acts.includes(c.id);\n        return { title: c.title, desc: c.desc, tags: c.tags, on: () => this.toggleAct(c.id),\n          border: on ? accent : '#E2DACB', bg: on ? '#f8efe9' : '#fff', mark: on ? '✓ Added' : '+' };\n      })\n    }));\n    const AI = D.ACT_INFO || {};\n    const selNames = this.state.acts.map(id => AI[id] ? AI[id].name : null).filter(Boolean);\n    const selSummary = selNames.length ? (selNames.length + ' selected: ' + selNames.join(', ') + '.') : 'You have Tue · Wed to explore, plus arrival and departure days. Tap cards to build your days.';\n\n    // local picks\n    const mkChips = (items, k, active, setter) => {\n      const cats = ['__all__', ...Array.from(new Set(items.map(x => x[k]).filter(Boolean)))];\n      return cats.map(c => ({ label: c === '__all__' ? 'All' : c, on: () => setter(c),\n        color: c === active ? '#F4EFE6' : '#7d7869', bg: c === active ? '#1F1E1B' : '#fff', border: c === active ? '#1F1E1B' : '#E2DACB' }));\n    };\n    const isUrl = s => /^https?:\\/\\//i.test(s || '');\n    const mkList = (items, k, active) => (active === '__all__' ? items : items.filter(x => x[k] === active)).map(x => {\n      const tags = [];\n      if (x.type) tags.push({ text: x.type, color: '#7d7869', border: '#E2DACB' });\n      if (x.walk) { const w = /minute/i.test(x.walk); tags.push({ text: (w ? 'on foot · ' : '') + x.walk, color: w ? '#5d6a4d' : '#9a9482', border: w ? '#cdd2bf' : '#E2DACB' }); }\n      return { name: x.name, href: isUrl(x.link) ? x.link : 'javascript:void(0)', suffix: isUrl(x.link) ? ' ↗' : '', tags, comments: x.comments || '', tip: x.tip || '' };\n    });\n    const LR = D.LOCAL_REST || [], LE = D.LOCAL_EXPL || [];\n    const restList = mkList(LR, 'when', this.state.restFilter);\n    const explList = mkList(LE, 'type', this.state.explFilter);\n\n    // walkable (curated)\n    const q = s => 'https://maps.google.com/maps?q=' + encodeURIComponent(s + ' San Francisco');\n    const walkable = [\n      ['Osso Steakhouse','2 min · 1177 California St'], ['Back2Back','3 min · 1257 Taylor St'],\n      ['Le Beau Market','4 min · 1263 Leavenworth'], ['Hot Sauce & Panko','9 min · 1468 Hyde St'],\n      ['Juniper Bakery','10 min · 1401 Polk St'], ['St. Frank Coffee','15 min · 2340 Polk St'],\n      [\"Swensen's Ice Cream\",'15 min · 1999 Hyde St'], ['Seven Hills','17 min · 1896 Hyde St']\n    ].map(([name, meta]) => ({ name, meta, href: q(name) }));\n\n    return {\n      guest: p.guestName || 'Welcome',\n      kicker: p.kicker || 'Welcome',\n      heroDates: p.heroDates || 'Jul 13 – 16',\n      subtitle: p.subtitle || \"Three days in the city by the bay — everything you need is here. Wander, taste, and make it your own.\",\n      arriveLabel: p.arriveLabel || 'Mon Jul 13',\n      stayLabel: p.stayLabel || 'Nob Hill',\n      departLabel: p.departLabel || 'Thu Jul 16',\n      address: p.address || '1221 Jones Street',\n      neighborhood: p.neighborhood || 'Nob Hill',\n      accent, show, nav, weather, flights, foodGroups, snackGroups, actGroups, walkable,\n      schedule: this.buildSchedule(D),\n      selSummary, goSchedule: () => this.setTab('schedule'),\n      restChips: mkChips(LR, 'when', this.state.restFilter, c => this.setState({ restFilter: c })),\n      explChips: mkChips(LE, 'type', this.state.explFilter, c => this.setState({ explFilter: c })),\n      restList, explList,\n      restCount: restList.length + (restList.length === 1 ? ' spot' : ' spots'),\n      explCount: explList.length + (explList.length === 1 ? ' place' : ' places'),\n      snackNoteVal: this._notes.snack, onSnackNote: (e) => { this._notes.snack = e.target.value; this.save(); },\n      hostNoteVal: this._notes.host, onHostNote: (e) => { this._notes.host = e.target.value; this.save(); },\n      saveStatus: this.state.saveStatus,\n      copyLabel: this.state.copyLabel, copySumLabel: this.state.copySumLabel,\n      summaryText: this.state.summaryText,\n      packMust: ['Real jacket or fleece — not optional','Layers you can add/remove — 15° swings','Comfortable closed-toe walking shoes','Scarf or neck layer for evening fog','Sunscreen — fog doesn\\'t block UV','A light daypack'],\n      packMuir: [\"It's 10–15° cooler in the grove\",'Closed-toe shoes — muddy trails','An extra layer in the bag','Water bottle','Offline maps — low cell service'],\n      apps: [\n        { name: 'Waymo One', desc: 'Driverless robotaxi — set up payment at home, not at the curb.' },\n        { name: 'Uber / Lyft', desc: 'For getting around independently on your own schedule.' },\n        { name: 'Google Maps', desc: 'Download the SF offline map before you leave — signal can be spotty.' }\n      ],\n      practical: [\n        { h: 'Cash', t: 'SF is mostly cashless, but a little helps at Ferry Building vendors and small shops.' },\n        { h: 'Sunscreen', t: \"Even on foggy days UV is strong — the marine layer doesn't block it like clouds.\" },\n        { h: 'Power bank', t: 'GPS, maps, and Waymo drain batteries fast on a full day out.' },\n        { h: 'Good shoes', t: 'Nob Hill is steep. Most of SF is hilly. Flip-flops on day one is a classic mistake.' },\n        { h: 'Dinner time', t: 'We eat around 5 PM — no waiting for an 8 PM reservation.' }\n      ],\n      copyLink: () => { try { navigator.clipboard.writeText(this.shareUrl()); this.setState({ copyLabel: 'Link copied ✓' }); setTimeout(() => this.setState({ copyLabel: 'Copy share link' }), 2200); } catch {} },\n      emailLink: () => { const s = encodeURIComponent('Welcome to San Francisco — your trip plan'); const b = encodeURIComponent(\"Here's the plan with everything you need — flights, food, neighborhood, and activities:\\n\\n\" + this.shareUrl()); location.href = 'mailto:?subject=' + s + '&body=' + b; },\n      genSummary: () => this.setState({ summaryText: this.buildSummary(D) }),\n      copySummary: () => { try { navigator.clipboard.writeText(this.state.summaryText); this.setState({ copySumLabel: 'Copied ✓' }); setTimeout(() => this.setState({ copySumLabel: 'Copy to clipboard' }), 2000); } catch {} }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
